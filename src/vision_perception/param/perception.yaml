perception_node:
  ros__parameters:
    use_sim_time: true
    image_topic: /camera/image_raw
    log_period_frames: 30
    gray_threshold: 150
    roi_bottom_ratio: 0.4
    clear_threshold: 0.7
    stop_threshold: 0.3
    hysteresis_margin: 0.2
    straight_exit_margin: 0.15
    stop_exit_margin: 0.1
    linear_speed: 0.2
    turn_linear_speed: 0.05
    turn_angular_speed: 0.5
    max_angular_accel: 2.0
    safety_timeout: 1.0
    # 雷达硬闸门距离。视觉盲区约 0.34m（相机 0.08m 高 + ROI 底部 40%），
    # 闸门必须大于盲区才能衔接；0.5m 同时给 0.2m/s 巡航留出转向余量
    safety_distance: 0.5
    # 侧身护卫：直行时任一侧雷达距离小于此值则禁止直行（防止贴障擦边卡死）
    side_guard_distance: 0.25
